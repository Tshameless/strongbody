name: slimup
description: SlimUp 减肥打卡激励App
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # 路由
  go_router: ^14.2.0

  # 本地数据库
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24

  # 本地存储
  shared_preferences: ^2.2.3

  # 云端服务
  supabase_flutter: ^2.5.6

  # 图表
  fl_chart: ^0.68.0

  # 日历
  table_calendar: ^3.1.2

  # 动画
  rive: ^0.13.8

  # 功能插件
  share_plus: ^9.0.0
  screenshot: ^3.0.0
  connectivity_plus: ^6.0.3
  flutter_local_notifications: ^17.1.2
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  intl: ^0.19.0
  uuid: ^4.4.0
  logger: ^2.3.0

  # UI
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
